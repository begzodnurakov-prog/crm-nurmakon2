{% extends 'base.html' %}
{% block title %}O'quvchini tahrirlash | Crm_nurmakon{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><header class="mb-4"><p class="section-kicker mb-1">O'QUVCHI</p><h1 class="page-heading">Ma'lumotlarni tahrirlash</h1></header>
<section class="card section-card"><div class="card-body p-4"><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">To'liq ism</label><input class="form-control" id="name" name="name" maxlength="100" value="{{ student.name }}" required></div><div class="col-md-6"><label class="form-label" for="phone">Telefon</label><input class="form-control" id="phone" name="phone" type="tel" maxlength="20" value="{{ student.phone }}" required></div>
    <div class="col-md-6"><label class="form-label" for="course">Kurs</label><input class="form-control" id="course" name="course" maxlength="100" value="{{ student.course }}" required></div><div class="col-md-6"><label class="form-label" for="group_id">Asosiy guruh</label><select class="form-select" id="group_id" name="group_id" required>{% for group in groups %}<option value="{{ group.id }}" {% if student.group_id == group.id %}selected{% endif %}>{{ group.title }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label" for="enrollment_date">Qabul qilingan sana</label><input class="form-control" id="enrollment_date" name="enrollment_date" type="date" value="{{ student.enrollment_date.isoformat() if student.enrollment_date else '' }}" required></div><div class="col-md-6"><label class="form-label" for="status">Holat</label><select class="form-select" id="status" name="status">{% for value,label in [('active','Faol'),('paused',"To'xtatilgan"),('completed','Yakunlangan')] %}<option value="{{ value }}" {% if student.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></div>
    <fieldset class="mt-4"><legend class="form-label">Ota-ona hisoblari</legend>{% for parent in parents %}<div class="form-check"><input class="form-check-input" type="checkbox" name="parent_ids" value="{{ parent.id }}" id="parent_{{ parent.id }}" {% if parent in student.parents %}checked{% endif %}><label class="form-check-label" for="parent_{{ parent.id }}">{{ parent.full_name }} ({{ parent.email }})</label></div>{% else %}<p class="small text-secondary">Faol ota-ona hisoblari topilmadi.</p>{% endfor %}</fieldset>
    <div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-primary" type="submit">Saqlash</button><a class="btn btn-outline-secondary" href="{{ url_for('students') }}">Bekor qilish</a></div>
</form><hr><form method="POST" action="{{ url_for('delete_student',student_id=student.id) }}" onsubmit="return confirm('O\'quvchini arxivlashga ishonchingiz komilmi?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger" type="submit">O'quvchini arxivlash</button></form></div></section>
</div></div>
{% endblock %}
