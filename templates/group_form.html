{% extends 'base.html' %}
{% block title %}Guruhni tahrirlash | Crm_nurmakon{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><header class="mb-4"><p class="section-kicker mb-1">GURUH</p><h1 class="page-heading">Guruh ma'lumotlari</h1></header><section class="card section-card"><div class="card-body p-4"><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="name">Guruh nomi</label><input class="form-control" id="name" name="name" value="{{ group.name }}" required></div><div class="mb-3"><label class="form-label" for="course_name">Kurs</label><input class="form-control" id="course_name" name="course_name" value="{{ group.course_name }}" required></div><div class="mb-3"><label class="form-label" for="teacher_id">O'qituvchi</label><select class="form-select" id="teacher_id" name="teacher_id"><option value="">Tayinlanmagan</option>{% for teacher in teachers %}<option value="{{ teacher.id }}" {% if group.teacher_id == teacher.id %}selected{% endif %}>{{ teacher.full_name }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label" for="schedule">Jadval</label><input class="form-control" id="schedule" name="schedule" value="{{ group.schedule }}"></div><div class="form-check mb-4"><input class="form-check-input" id="is_active" name="is_active" type="checkbox" {% if group.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Guruh faol</label></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Saqlash</button><a class="btn btn-outline-secondary" href="{{ url_for('groups') }}">Orqaga</a></div>
</form><hr><form method="POST" action="{{ url_for('delete_group',group_id=group.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger" type="submit">Guruhni o'chirish</button><span class="small text-secondary ms-2">Faqat bo'sh guruhni o'chirish mumkin.</span></form></div></section></div></div>
{% endblock %}
