{% extends 'base.html' %}
{% block title %}Guruhni tahrirlash | Crm_nurmakon{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><header class="mb-4"><p class="section-kicker mb-1">GURUH</p><h1 class="page-heading">Guruh ma'lumotlari</h1></header><section class="card section-card"><div class="card-body p-4"><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="title">Guruh nomi</label><input class="form-control" id="title" name="title" maxlength="100" value="{{ group.title }}" required></div><div class="mb-3"><label class="form-label" for="course_id">Kurs</label><select class="form-select" id="course_id" name="course_id" required>{% for course in courses %}<option value="{{ course.id }}" {% if group.course_id == course.id %}selected{% endif %}>{{ course.title }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label" for="teacher_id">O'qituvchi</label><select class="form-select" id="teacher_id" name="teacher_id"><option value="">Tayinlanmagan</option>{% for teacher in teachers %}<option value="{{ teacher.id }}" {% if group.teacher_id == teacher.id %}selected{% endif %}>{{ teacher.full_name }}</option>{% endfor %}</select></div>
<div class="row g-3 mb-3"><div class="col-sm-7"><label class="form-label" for="schedule_days">Dars kunlari</label><select class="form-select" id="schedule_days" name="schedule_days"><option value="">Tanlanmagan</option><option value="Mon-Wed-Fri" {% if group.schedule_days == 'Mon-Wed-Fri' %}selected{% endif %}>Mon-Wed-Fri</option><option value="Tue-Thu-Sat" {% if group.schedule_days == 'Tue-Thu-Sat' %}selected{% endif %}>Tue-Thu-Sat</option></select></div><div class="col-sm-5"><label class="form-label" for="start_time">Boshlanish vaqti</label><input class="form-control" id="start_time" name="start_time" type="time" value="{{ group.start_time.strftime('%H:%M') if group.start_time else '' }}"></div><div class="col-sm-6"><label class="form-label" for="room_number">Xona raqami</label><input class="form-control" id="room_number" name="room_number" maxlength="80" value="{{ group.room_number }}"></div>{% if not group.schedule_days and group.schedule %}<div class="col-sm-6"><label class="form-label" for="schedule">Eski jadval / izoh</label><input class="form-control" id="schedule" name="schedule" value="{{ group.schedule }}"></div>{% endif %}</div><div class="form-check mb-4"><input class="form-check-input" id="is_active" name="is_active" type="checkbox" {% if group.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Guruh faol</label></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Saqlash</button><a class="btn btn-outline-secondary" href="{{ url_for('group_detail',group_id=group.id) }}">Orqaga</a></div>
</form><hr><form method="POST" action="{{ url_for('delete_group',group_id=group.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger" type="submit">Guruhni o'chirish</button><span class="small text-secondary ms-2">Faqat bo'sh guruhni o'chirish mumkin.</span></form></div></section></div></div>
{% endblock %}
