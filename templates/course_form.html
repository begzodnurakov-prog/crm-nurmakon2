{% extends 'base.html' %}
{% block title %}Kursni tahrirlash | Crm_nurmakon{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><header class="mb-4"><p class="section-kicker mb-1">KURS</p><h1 class="page-heading">Kurs ma'lumotlari</h1></header><section class="card section-card"><div class="card-body p-4"><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="title">Kurs nomi</label><input class="form-control" id="title" name="title" maxlength="120" value="{{ course.title }}" required></div><div class="mb-3"><label class="form-label" for="price">Oylik narx</label><input class="form-control" id="price" name="price" type="number" min="0" step="0.01" value="{{ course.price }}" required></div><div class="mb-4"><label class="form-label" for="duration_months">Davomiyligi (oy)</label><input class="form-control" id="duration_months" name="duration_months" type="number" min="1" max="120" value="{{ course.duration_months }}" required></div><div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Saqlash</button><a class="btn btn-outline-secondary" href="{{ url_for('courses') }}">Orqaga</a></div></form><hr><form method="POST" action="{{ url_for('delete_course',course_id=course.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger" type="submit">Kursni o'chirish</button><span class="small text-secondary ms-2">Bog'langan guruhlar avval boshqa kursga o'tkaziladi.</span></form></div></section></div></div>
{% endblock %}
