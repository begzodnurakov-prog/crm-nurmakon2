services:
  - type: web
    name: crm-nurmakon
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask --app app db upgrade && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-nurmakon-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: crm-nurmakon-cache
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: crm-nurmakon-cache
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: crm-nurmakon-db
    databaseName: crmnurmakon
    user: crmnurmakon
    plan: free
    region: oregon
