<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#155c49">
    <title>Offline | Nurmakon CRM</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20302a; background: #f3f6f3; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: linear-gradient(135deg,#d4fc79,#f6d365); }
        main { width: min(100%, 28rem); padding: 2rem; border-radius: 12px; background: #fff; text-align: center; box-shadow: 0 12px 40px #20302a1c; }
        h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
        p { color: #66756d; line-height: 1.6; }
        button { margin-top: .75rem; padding: .75rem 1rem; border: 0; border-radius: 6px; color: #fff; background: #155c49; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Aloqa mavjud emas</h1>
        <p>CRM ma'lumotlari xavfsizlik uchun offline saqlanmaydi. Internetga ulangach qayta urinib ko'ring.</p>
        <button type="button" onclick="location.reload()">Qayta urinish</button>
    </main>
</body>
</html>
